name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台与构建工具
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 固定用官方发行版：wrapper 里的 distributionUrl 指向腾讯镜像，
          # 在境外 runner 上拉 130MB 容易慢到超时，这里直接装官方 8.11.1
          gradle-version: '8.11.1'

      - name: 单元测试
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint 检查
        run: gradle --no-daemon lintDebug
        continue-on-error: true

      - name: 构建 Debug APK
        run: gradle --no-daemon assembleDebug

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: doit-debug-apk
          path: app/build/outputs/apk/debug/doit-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: 打正式包
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台与构建工具
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 固定用官方发行版：wrapper 里的 distributionUrl 指向腾讯镜像，
          # 在境外 runner 上拉 130MB 容易慢到超时，这里直接装官方 8.11.1
          gradle-version: '8.11.1'

      # 仓库里不放私钥：配好这四个 secret 就用正式证书签名，
      # 没配则回退 debug 证书（包仍可安装，只是不能直接上架）。
      # 注意：secrets 上下文不能出现在 steps.if 里（GitHub 会在解析阶段直接判整个工作流非法，
      # 表现为 0 秒失败、一个 job 都不启动），所以判空放在 shell 里做。
      - name: 还原签名证书（可选）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::未配置 KEYSTORE_BASE64，本次回退 debug 证书签名"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/quandian-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/quandian-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: 构建 Release APK
        run: gradle --no-daemon assembleRelease

      - name: 规整产物名（doit-<tag>-release.apk）
        run: |
          src=$(ls app/build/outputs/apk/release/doit-*.apk | head -1)
          cp "$src" "doit-${GITHUB_REF_NAME}-release.apk"
          ls -lh doit-*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: doit-release-apk
          path: doit-*-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: doit ${{ github.ref_name }}
          files: doit-*-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
