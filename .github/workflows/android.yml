name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它会执行 `sdkmanager --install tools`，
      # 而新版 SDK 仓库已删除 legacy 的 `tools` 包，必然报 Failed to find package 'tools'。
      # ubuntu 镜像本来就预装了 Android SDK + 已接受 licenses，这里只补齐缺失的组件。
      - name: 配置 Android SDK
        shell: bash
        run: |
          set -u
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK 目录：$SDK"
          { echo "ANDROID_HOME=$SDK"; echo "ANDROID_SDK_ROOT=$SDK"; } >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
            if [ -z "$SM" ]; then echo "::error::SDK 缺 android-35 且找不到 sdkmanager"; exit 1; fi
            echo "补装缺失组件：$SM"
            "$SM" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 固定用官方发行版：wrapper 里的 distributionUrl 指向腾讯镜像，
          # 在境外 runner 上拉 130MB 容易慢到超时，这里直接装官方 8.11.1
          gradle-version: '8.11.1'
          # CI 不调用 ./gradlew，没必要再校验 wrapper jar（校验不过会直接失败）
          validate-wrappers: false

      - name: 单元测试
        run: gradle --no-daemon testDebugUnitTest 2>&1 | tee -a ci-build.log

      - name: Lint 检查
        run: gradle --no-daemon lintDebug 2>&1 | tee -a ci-build.log
        continue-on-error: true

      - name: 构建 Debug APK
        run: gradle --no-daemon assembleDebug 2>&1 | tee -a ci-build.log

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: doit-debug-apk
          path: app/build/outputs/apk/debug/doit-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      # 私有仓库没有 token 读不到 Actions 日志，这里把构建输出回传到 ci-log 分支，
      # 本地 `git fetch origin ci-log` 就能看，不用再截图往返。
      # continue-on-error：这一步自身失败不影响构建结论。
      - name: 回传构建日志到 ci-log 分支
        if: always()
        continue-on-error: true
        run: |
          set -u
          {
            echo "run_number: ${GITHUB_RUN_NUMBER}"
            echo "ref: ${GITHUB_REF}"
            echo "sha: ${GITHUB_SHA}"
            echo "status: ${{ job.status }}"
            echo "----------------------------------------"
            [ -f ci-build.log ] && tail -c 200000 ci-build.log || echo "(没有捕获到 gradle 输出)"
          } > ci-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ci-log-report
          git rm -rq --cached .
          git add -f ci-report.txt
          git commit -qm "ci report #${GITHUB_RUN_NUMBER} [${{ job.status }}]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log

  release:
    name: 打正式包
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它会执行 `sdkmanager --install tools`，
      # 而新版 SDK 仓库已删除 legacy 的 `tools` 包，必然报 Failed to find package 'tools'。
      # ubuntu 镜像本来就预装了 Android SDK + 已接受 licenses，这里只补齐缺失的组件。
      - name: 配置 Android SDK
        shell: bash
        run: |
          set -u
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK 目录：$SDK"
          { echo "ANDROID_HOME=$SDK"; echo "ANDROID_SDK_ROOT=$SDK"; } >> "$GITHUB_ENV"
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
            if [ -z "$SM" ]; then echo "::error::SDK 缺 android-35 且找不到 sdkmanager"; exit 1; fi
            echo "补装缺失组件：$SM"
            "$SM" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "--- platforms ---"; ls "$SDK/platforms" || true
          echo "--- build-tools ---"; ls "$SDK/build-tools" || true

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 固定用官方发行版：wrapper 里的 distributionUrl 指向腾讯镜像，
          # 在境外 runner 上拉 130MB 容易慢到超时，这里直接装官方 8.11.1
          gradle-version: '8.11.1'
          # CI 不调用 ./gradlew，没必要再校验 wrapper jar（校验不过会直接失败）
          validate-wrappers: false

      # 仓库里不放私钥：配好这四个 secret 就用正式证书签名，
      # 没配则回退 debug 证书（包仍可安装，只是不能直接上架）。
      # 注意：secrets 上下文不能出现在 steps.if 里（GitHub 会在解析阶段直接判整个工作流非法，
      # 表现为 0 秒失败、一个 job 都不启动），所以判空放在 shell 里做。
      - name: 还原签名证书（可选）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::未配置 KEYSTORE_BASE64，本次回退 debug 证书签名"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/quandian-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/quandian-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: 构建 Release APK
        run: gradle --no-daemon assembleRelease 2>&1 | tee -a ci-build.log

      - name: 规整产物名（doit-<tag>-release.apk）
        run: |
          src=$(ls app/build/outputs/apk/release/doit-*.apk | head -1)
          cp "$src" "doit-${GITHUB_REF_NAME}-release.apk"
          ls -lh doit-*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: doit-release-apk
          path: doit-*-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: doit ${{ github.ref_name }}
          files: doit-*-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      # 与 build job 同理：日志回传到 ci-log-release 分支，没有 token 也能排障
      - name: 回传构建日志到 ci-log-release 分支
        if: always()
        continue-on-error: true
        run: |
          set -u
          {
            echo "run_number: ${GITHUB_RUN_NUMBER}"
            echo "ref: ${GITHUB_REF}"
            echo "sha: ${GITHUB_SHA}"
            echo "status: ${{ job.status }}"
            echo "----------------------------------------"
            [ -f ci-build.log ] && tail -c 200000 ci-build.log || echo "(没有捕获到 gradle 输出)"
          } > ci-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ci-log-release-report
          git rm -rq --cached .
          git add -f ci-report.txt
          git commit -qm "release report #${GITHUB_RUN_NUMBER} [${{ job.status }}]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log-release
