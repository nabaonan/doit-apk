name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint 检查
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: doit-debug-apk
          path: app/build/outputs/apk/debug/doit-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: 打正式包
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 仓库里不放私钥：配好这四个 secret 就用正式证书签名，
      # 没配则回退 debug 证书（包仍可安装，只是不能直接上架）。
      - name: 还原签名证书
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/quandian-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/quandian-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 构建 Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: 规整产物名（doit-<tag>-release.apk）
        run: |
          src=$(ls app/build/outputs/apk/release/doit-*.apk | head -1)
          cp "$src" "doit-${GITHUB_REF_NAME}-release.apk"
          ls -lh doit-*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: doit-release-apk
          path: doit-*-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: doit ${{ github.ref_name }}
          files: doit-*-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
